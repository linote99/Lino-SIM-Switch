name: Build Magisk Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VER=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Fix permissions
        run: |
          chmod 755 module/post-fs-data.sh
          chmod 755 module/META-INF/com/google/android/update-binary

      - name: Package
        run: |
          cd module
          zip -r "../Lino-SIM-Switch-${{ steps.ver.outputs.version }}.zip" \
            module.prop post-fs-data.sh META-INF/com/google/android/update-binary

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ steps.ver.outputs.version }}
          path: Lino-SIM-Switch-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Lino-SIM-Switch-*.zip
